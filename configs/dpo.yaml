# LoRA-DPO stage, applied on top of the merged SFT model.
learning_rate: 5.0e-5
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
beta: 0.1
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
seed: 0
# v1 = the file every recorded run used; v2 restores the no-solution problems (bug 8)
data_path: ../data/dpo_pairs_zeroshot.jsonl
