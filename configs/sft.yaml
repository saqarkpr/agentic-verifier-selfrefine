# LoRA-SFT stage. Defaults reproduce the four recorded runs.
learning_rate: 1.0e-4
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
max_length: 512
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
seed: 0                    # fixes data order and dropout; CUDA kernels are
                           # still non-deterministic, see PROVENANCE.md
